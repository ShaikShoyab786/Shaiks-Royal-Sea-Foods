openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Shaik's Royal Sea Foods API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: products
    description: Product management
  - name: timeslots
    description: Delivery time slots
  - name: orders
    description: Order management
  - name: executives
    description: Field executive management
  - name: deliveries
    description: Delivery management
  - name: reports
    description: Reports and analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/send-otp:
    post:
      operationId: sendOtp
      tags: [auth]
      summary: Send OTP to phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpResponse"
        "400":
          description: Invalid phone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify OTP and get auth token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user info
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create product (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update product (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete product (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /timeslots:
    get:
      operationId: listTimeslots
      tags: [timeslots]
      summary: List all delivery time slots
      responses:
        "200":
          description: Time slot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Timeslot"

  /timeslots/{id}:
    patch:
      operationId: updateTimeslot
      tags: [timeslots]
      summary: Update time slot (admin - toggle active, set max orders)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeslotUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeslot"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders (customer sees own, admin sees all)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: executiveId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order (customer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/assign:
    patch:
      operationId: assignOrder
      tags: [orders]
      summary: Assign order to field executive (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderAssign"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/cancel:
    patch:
      operationId: cancelOrder
      tags: [orders]
      summary: Cancel an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/cash-collected:
    patch:
      operationId: markCashCollected
      tags: [orders]
      summary: Mark COD cash as collected (field executive)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /executives:
    get:
      operationId: listExecutives
      tags: [executives]
      summary: List all field executives (admin)
      responses:
        "200":
          description: Executive list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Executive"
    post:
      operationId: createExecutive
      tags: [executives]
      summary: Add a new field executive (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutiveInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Executive"

  /executives/{id}:
    delete:
      operationId: deleteExecutive
      tags: [executives]
      summary: Remove a field executive (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /executives/{id}/deliveries:
    get:
      operationId: listDeliveriesForExecutive
      tags: [executives]
      summary: Get deliveries assigned to a specific executive (defaults to today)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /executives/me/deliveries:
    get:
      operationId: getMyDeliveries
      tags: [executives]
      summary: Get current executive's deliveries for today
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: My deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /reports/daily:
    get:
      operationId: getDailyReport
      tags: [reports]
      summary: Get daily sales and order report (admin)
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"

  /reports/summary:
    get:
      operationId: getOrderSummary
      tags: [reports]
      summary: Get overall order summary stats (admin)
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    OtpRequest:
      type: object
      properties:
        phone:
          type: string
      required:
        - phone

    OtpResponse:
      type: object
      properties:
        message:
          type: string
        expiresIn:
          type: integer
      required:
        - message
        - expiresIn

    OtpVerify:
      type: object
      properties:
        phone:
          type: string
        otp:
          type: string
      required:
        - phone
        - otp

    AdminLoginInput:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    AuthToken:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: ["string", "null"]
        name:
          type: string
        role:
          type: string
          enum: [customer, admin, executive]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - role
        - createdAt

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: ["string", "null"]
        pricePerKg:
          type: number
        weightKg:
          type: number
        inStock:
          type: boolean
        category:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - pricePerKg
        - weightKg
        - inStock
        - category
        - createdAt

    ProductInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        pricePerKg:
          type: number
        weightKg:
          type: number
        inStock:
          type: boolean
        category:
          type: string
      required:
        - name
        - description
        - pricePerKg
        - weightKg
        - category

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: ["string", "null"]
        pricePerKg:
          type: number
        weightKg:
          type: number
        inStock:
          type: boolean
        category:
          type: string

    Timeslot:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        startHour:
          type: integer
        endHour:
          type: integer
        isActive:
          type: boolean
        maxOrders:
          type: integer
        currentOrders:
          type: integer
      required:
        - id
        - label
        - startHour
        - endHour
        - isActive
        - maxOrders
        - currentOrders

    TimeslotUpdate:
      type: object
      properties:
        isActive:
          type: boolean
        maxOrders:
          type: integer

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        weightKg:
          type: number
        pricePerKg:
          type: number
        total:
          type: number
      required:
        - id
        - productId
        - productName
        - weightKg
        - pricePerKg
        - total

    Order:
      type: object
      properties:
        id:
          type: integer
        customerId:
          type: integer
        customerName:
          type: string
        customerPhone:
          type: string
        timeslotId:
          type: integer
        timeslotLabel:
          type: string
        deliveryDate:
          type: string
          format: date
        deliveryAddress:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        distanceKm:
          type: number
        deliveryCharge:
          type: number
        subtotal:
          type: number
        total:
          type: number
        paymentMethod:
          type: string
          enum: [cod, online]
        paymentStatus:
          type: string
          enum: [pending, paid]
        status:
          type: string
          enum: [pending, confirmed, assigned, out_for_delivery, delivered, cancelled]
        executiveId:
          type: ["integer", "null"]
        executiveName:
          type: ["string", "null"]
        cashCollected:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - customerId
        - customerName
        - customerPhone
        - timeslotId
        - timeslotLabel
        - deliveryDate
        - deliveryAddress
        - latitude
        - longitude
        - distanceKm
        - deliveryCharge
        - subtotal
        - total
        - paymentMethod
        - paymentStatus
        - status
        - cashCollected
        - items
        - createdAt

    OrderInput:
      type: object
      properties:
        timeslotId:
          type: integer
        deliveryDate:
          type: string
          format: date
        deliveryAddress:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        paymentMethod:
          type: string
          enum: [cod, online]
        notes:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"
      required:
        - timeslotId
        - deliveryDate
        - deliveryAddress
        - latitude
        - longitude
        - paymentMethod
        - items

    OrderItemInput:
      type: object
      properties:
        productId:
          type: integer
        weightKg:
          type: number
      required:
        - productId
        - weightKg

    OrderAssign:
      type: object
      properties:
        executiveId:
          type: integer
      required:
        - executiveId

    OrderStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [confirmed, assigned, out_for_delivery, delivered, cancelled]
      required:
        - status

    Executive:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        isActive:
          type: boolean
        todayDeliveries:
          type: integer
        todayCashCollected:
          type: number
        todayFuelEarned:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - phone
        - isActive
        - todayDeliveries
        - todayCashCollected
        - todayFuelEarned
        - createdAt

    ExecutiveInput:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
      required:
        - name
        - phone

    DailyReport:
      type: object
      properties:
        date:
          type: string
          format: date
        totalOrders:
          type: integer
        deliveredOrders:
          type: integer
        pendingOrders:
          type: integer
        cancelledOrders:
          type: integer
        totalRevenue:
          type: number
        codRevenue:
          type: number
        onlineRevenue:
          type: number
        totalDeliveryCharges:
          type: number
        topProducts:
          type: array
          items:
            $ref: "#/components/schemas/ProductStat"
        morningSlotOrders:
          type: integer
        afternoonSlotOrders:
          type: integer
      required:
        - date
        - totalOrders
        - deliveredOrders
        - pendingOrders
        - cancelledOrders
        - totalRevenue
        - codRevenue
        - onlineRevenue
        - totalDeliveryCharges
        - topProducts
        - morningSlotOrders
        - afternoonSlotOrders

    ProductStat:
      type: object
      properties:
        productId:
          type: integer
        productName:
          type: string
        totalKg:
          type: number
        totalRevenue:
          type: number
      required:
        - productId
        - productName
        - totalKg
        - totalRevenue

    OrderSummary:
      type: object
      properties:
        totalOrders:
          type: integer
        totalRevenue:
          type: number
        totalCustomers:
          type: integer
        pendingOrders:
          type: integer
        todayOrders:
          type: integer
        todayRevenue:
          type: number
        weekOrders:
          type: integer
        weekRevenue:
          type: number
      required:
        - totalOrders
        - totalRevenue
        - totalCustomers
        - pendingOrders
        - todayOrders
        - todayRevenue
        - weekOrders
        - weekRevenue
